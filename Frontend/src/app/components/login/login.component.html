<div class="img-container">
  <a href="http://localhost:4200/user" target="_blank"> 
    <img src="user.png" alt="Descripción de la imagen" class="small-img">
  </a>
</div>
<mat-card class="login-card">
    <mat-card-title class="text-center">Iniciar Sesión</mat-card-title>
    <mat-card-content>
      <div class="login-form">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <mat-form-field appearance="fill" class="w-100">
              <mat-label>Correo electrónico</mat-label>
              <input
                matInput
                type="email"
                formControlName="Email"
                [ngClass]="{ 'is-invalid': submitted && f['Email'].errors }"
                placeholder="Ingresa tu correo"
              />
              <mat-error *ngIf="(f['Email'].touched || submitted) && f['Email'].errors">
                <div *ngIf="f['Email'].errors['required']" class="error">El correo es requerido</div>
                <div *ngIf="f['Email'].errors['Email']" class="error">Correo inválido</div>
              </mat-error>
            </mat-form-field>
          </div>
          <div class="form-group">
            <mat-form-field class="w-100">
              <mat-label>Contraseña</mat-label>
              <input
                matInput
                type="password"
                formControlName="Contraseña"
                [ngClass]="{ 'is-invalid': submitted && f['Contraseña'].errors }"
                placeholder="Ingresa tu contraseña"
              />
              <mat-error *ngIf="(f['Contraseña'].touched || submitted) && f['Contraseña'].errors">
                <div *ngIf="f['Contraseña'].errors['required']" class="error">La contraseña es requerida</div>
                <div *ngIf="f['Contraseña'].errors['minlength']" class="error">Mínimo 6 caracteres</div>
              </mat-error>
            </mat-form-field>
          </div>
          <button mat-raised-button color="primary" type="submit" (click)="onLogin()">Iniciar sesión</button>
          <button  mat-raised-button color="primary" (click)="Users()">Usuarios</button>
        </form>
      </div>
    </mat-card-content>
  </mat-card>
